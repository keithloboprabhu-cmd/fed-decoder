<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter Tight'; src: url('/app/static/fonts/InterTight.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('/app/static/fonts/JetBrainsMono.woff2') format('woff2'); font-weight: 100 800; }
  :root { --bg:#FAFAF7; --ink:#141414; --sub:#5C5C58; --rule:#E6E4DE; --hike:#C8402A; --cut:#2B5FAF; --hold:#6E6E6A; }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: 'Inter Tight', system-ui, sans-serif; color: var(--ink); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 4px; height: 30px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  .bar button { font: 500 13px 'JetBrains Mono', monospace; color: var(--sub); background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .bar button:hover { color: var(--ink); }
  .bar button.on { color: var(--ink); border-color: var(--rule); background: #fff; }
  .bar button:focus-visible { outline: 2px solid var(--ink); }
  .bar .hint { margin-left: auto; font: 13px 'Inter Tight', sans-serif; color: var(--sub); white-space: nowrap; padding-left: 10px; }
  @media (max-width: 520px) { .bar .hint { display: none; } }
  svg { display: block; width: 100%; touch-action: pan-y; cursor: crosshair; outline: none; }
  svg:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 6px; }
  .axis { font: 13px 'JetBrains Mono', monospace; fill: var(--sub); }
  .grid { stroke: var(--rule); stroke-width: 1; }
  .band { fill: #EDEBE5; }
  .flat { stroke: var(--hold); stroke-width: 1.6; fill: none; }
  .up { stroke: var(--hike); stroke-width: 2.6; }
  .down { stroke: var(--cut); stroke-width: 2.6; }
  .tick { stroke-width: 0; }
  .marker { transition: transform .3s ease-out; }
  @media (prefers-reduced-motion: reduce) { .marker { transition: none; } }
  .hair { stroke: var(--ink); stroke-width: 1; }
  .lbl { font: 600 13px 'JetBrains Mono', monospace; fill: var(--ink); }
  .ghost { opacity: 0; transition: opacity .12s; pointer-events: none; }
  .ghost.on { opacity: 1; }
  .glbl { font: 13px 'JetBrains Mono', monospace; fill: var(--sub); }
</style>
</head>
<body>
<div class="bar" id="bar" role="group" aria-label="Zoom presets"></div>
<svg id="chart" tabindex="0" role="slider" aria-label="Rate staircase: choose a meeting. Use arrow keys to step through meetings."></svg>
<script>
(function () {
  // ---- minimal Streamlit component protocol (no npm build needed) ----
  const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
  const setValue = (v) => send("streamlit:setComponentValue", { value: v, dataType: "json" });
  const setHeight = (h) => send("streamlit:setFrameHeight", { height: h });

  const H = 172, PAD_L = 40, PAD_R = 14, PAD_T = 24, PAD_B = 22;
  const svg = document.getElementById("chart"), bar = document.getElementById("bar");
  svg.setAttribute("height", H);
  let M = [], presets = [], sel = -1, view = null, viewName = null, nonce = 0, today = null, lastArgsSel = null, keyTimer = null, dragging = false;

  const t = (d) => new Date(d + "T12:00:00Z").getTime();
  const fmt = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  const pct = (v) => v.toFixed(2).replace(/0$/, "") + "%";

  function nearest(px) {
    const W = svg.clientWidth, [a, b] = view;
    const tt = a + (px - PAD_L) / (W - PAD_L - PAD_R) * (b - a);
    let best = -1, bd = Infinity;
    M.forEach((m, i) => { const dd = Math.abs(t(m.d) - tt); if (t(m.d) >= a - 864e5 * 40 && t(m.d) <= b + 864e5 * 40 && dd < bd) { bd = dd; best = i; } });
    return best;
  }

  function ensureVisible(i) {
    if (i < 0) return;
    const x = t(M[i].d);
    if (view && x >= view[0] && x <= view[1]) return;
    const span = 3 * 365.25 * 864e5;
    const end = Math.min(t(today), x + span / 2), start = end - span;
    view = [Math.max(t(M[0].d) - 864e5 * 30, start), end]; viewName = null; drawBar();
  }

  function drawBar() {
    bar.innerHTML = "";
    presets.forEach((p) => {
      const b = document.createElement("button");
      b.textContent = p.label; if (p.label === viewName) b.className = "on";
      b.onclick = () => { view = [t(p.start), t(p.end)]; viewName = p.label; drawBar(); draw(); };
      bar.appendChild(b);
    });
    const h = document.createElement("span"); h.className = "hint"; h.textContent = "Drag or ← →"; bar.appendChild(h);
  }

  function draw() {
    const W = svg.clientWidth || 800; if (!view || !M.length) return;
    const [a, b] = view;
    const inView = M.filter((m) => t(m.d) >= a && t(m.d) <= b);
    const prevIdx = M.findIndex((m) => t(m.d) >= a);
    const pool = inView.concat(prevIdx > 0 ? [M[prevIdx - 1]] : []);
    const top = Math.max(0.5, ...pool.map((m) => m.hi)) + 0.5;
    const X = (tt) => PAD_L + (tt - a) / (b - a) * (W - PAD_L - PAD_R);
    const Y = (v) => PAD_T + (top - v) / top * (H - PAD_T - PAD_B);
    let s = "";
    // y grid + labels
    const step = top > 4 ? 1 : 0.5;
    for (let v = 0; v <= top; v += step) s += `<line class="grid" x1="${PAD_L}" x2="${W - PAD_R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${PAD_L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}%</text>`;
    // x labels (years)
    const y0 = new Date(a).getUTCFullYear(), y1 = new Date(b).getUTCFullYear();
    const every = (y1 - y0) > 12 ? 4 : (y1 - y0) > 6 ? 2 : 1;
    for (let y = y0; y <= y1 + 1; y++) { const tt = Date.UTC(y, 0, 1); if (tt >= a && tt <= b && y % every === 0) s += `<text class="axis" x="${X(tt)}" y="${H - 5}" text-anchor="middle">${y}</text>`; }
    // range band + steps
    let band = "", flats = "", ups = "", downs = "";
    for (let i = Math.max(0, prevIdx - 1); i < M.length; i++) {
      const m = M[i], x0 = Math.max(X(t(m.d)), PAD_L), nextT = i + 1 < M.length ? t(M[i + 1].d) : t(today);
      if (t(m.d) > b) break;
      const x1 = Math.min(X(nextT), W - PAD_R);
      if (x1 > PAD_L) {
        band += `<rect class="band" x="${x0}" width="${Math.max(0, x1 - x0)}" y="${Y(m.hi)}" height="${Math.max(1, Y(m.lo) - Y(m.hi))}"/>`;
        flats += `M${x0} ${Y(m.hi)} H${x1} `;
      }
      if (i > 0 && t(m.d) >= a && m.c !== 0) {
        const xs = X(t(m.d)), pv = M[i - 1].hi;
        (m.c > 0 ? (ups += `M${xs} ${Y(pv)} V${Y(m.hi)} `) : (downs += `M${xs} ${Y(pv)} V${Y(m.hi)} `));
      }
    }
    s += band + `<path class="flat" d="${flats}"/><path class="up" d="${ups}" stroke-linecap="round"/><path class="down" d="${downs}" stroke-linecap="round"/>`;
    // ghost (hover) and selected marker
    s += `<g id="ghost" class="ghost"><line class="hair" y1="${PAD_T - 6}" y2="${H - PAD_B}" stroke-dasharray="2 3" opacity=".5"/><text class="glbl" y="${PAD_T - 10}"></text></g>`;
    if (sel >= 0) {
      const m = M[sel], mx = X(t(m.d)), my = Y(m.hi);
      const col = m.c > 0 ? "#C8402A" : m.c < 0 ? "#2B5FAF" : "#141414";
      const lx = Math.min(Math.max(mx, PAD_L + 50), W - PAD_R - 50);
      s += `<g class="marker" id="marker" style="transform: translate(${mx}px, 0)"><line class="hair" y1="${PAD_T - 6}" y2="${H - PAD_B}"/>` +
           `<circle cy="${my}" r="7" fill="${col}" stroke="#FAFAF7" stroke-width="3"/></g>` +
           `<text class="lbl" x="${lx}" y="${PAD_T - 10}" text-anchor="middle">${fmt(m.d)}</text>`;
    }
    svg.innerHTML = s;
    svg.setAttribute("aria-valuetext", sel >= 0 ? fmt(M[sel].d) : "");
  }

  function showGhost(i) {
    const g = document.getElementById("ghost"); if (!g || i < 0) return;
    const W = svg.clientWidth, [a, b] = view, x = PAD_L + (t(M[i].d) - a) / (b - a) * (W - PAD_L - PAD_R);
    g.setAttribute("transform", `translate(${x},0)`);
    const tx = g.querySelector("text"); tx.textContent = `${fmt(M[i].d)} · ${M[i].lab}`;
    tx.setAttribute("text-anchor", x > W - 160 ? "end" : x < 160 ? "start" : "middle");
    g.classList.add("on");
  }

  function select(i, commit) {
    if (i < 0 || i >= M.length) return;
    sel = i; ensureVisible(i); draw();
    if (commit) { nonce += 1; setValue({ date: M[i].d, n: nonce }); }
  }

  svg.addEventListener("pointerdown", (e) => { dragging = true; svg.setPointerCapture(e.pointerId); select(nearest(e.offsetX), false); });
  svg.addEventListener("pointermove", (e) => { const i = nearest(e.offsetX); if (dragging) { if (i !== sel) select(i, false); } else showGhost(i); });
  svg.addEventListener("pointerup", (e) => { if (dragging) { dragging = false; select(nearest(e.offsetX), true); } });
  svg.addEventListener("pointerleave", () => { const g = document.getElementById("ghost"); if (g) g.classList.remove("on"); });
  svg.addEventListener("keydown", (e) => {
    let i = sel;
    if (e.key === "ArrowLeft") i = Math.max(0, sel - 1);
    else if (e.key === "ArrowRight") i = Math.min(M.length - 1, sel + 1);
    else if (e.key === "Home") i = 0;
    else if (e.key === "End") i = M.length - 1;
    else return;
    e.preventDefault(); select(i, false);
    clearTimeout(keyTimer); keyTimer = setTimeout(() => select(sel, true), 350);  // commit once the reader stops pressing
  });
  new ResizeObserver(() => draw()).observe(svg);

  window.addEventListener("message", (ev) => {
    const d = ev.data; if (!d || d.type !== "streamlit:render") return;
    const args = d.args || {};
    if (!M.length) { M = args.meetings; presets = args.presets; today = args.today; }
    if (args.selected !== lastArgsSel) {  // the app moved to another meeting (chip, ask bar): glide there
      lastArgsSel = args.selected;
      const i = M.findIndex((m) => m.d === args.selected);
      if (i >= 0) { sel = i; if (!view) { const p = presets.find((x) => x.label === args.default_preset); view = [t(p.start), t(p.end)]; viewName = p.label; } ensureVisible(i); }
    }
    if (!view) { const p = presets.find((x) => x.label === args.default_preset) || presets[presets.length - 1]; view = [t(p.start), t(p.end)]; viewName = p.label; }
    drawBar(); draw(); setHeight(30 + H + 4);
  });
  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
